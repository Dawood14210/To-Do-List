name: Android APK

# Builds a debug APK on every push to main, and on demand from the Actions tab
# (Run workflow ▸ Android APK ▸ Run workflow) so anyone can grab an installable
# build without setting up Android Studio.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one build per ref: a new push cancels the previous, still-running one.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 generates Java 21 compile options for every module (the app,
      # @capacitor/android and all five plugins), so the build needs a JDK 21.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync the web build into the Android project
        run: npx cap sync android

      # `ubuntu-latest` ships the Android SDK (ANDROID_HOME, platform 36 and
      # build-tools 36.0.0 — exactly what this project compiles against), so the
      # SDK is only bootstrapped if an image ever stops shipping one.
      - name: Locate the Android SDK
        id: sdk
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$sdk" ]; then
            echo "dir=$sdk" >> "$GITHUB_OUTPUT"
          else
            echo "dir=" >> "$GITHUB_OUTPUT"
          fi
          echo "Android SDK found at: $sdk"

      - name: Set up the Android SDK
        if: steps.sdk.outputs.dir == ''
        uses: android-actions/setup-android@v3

      - name: Point Gradle at the Android SDK
        run: |
          sdk="${{ steps.sdk.outputs.dir }}"
          if [ -z "$sdk" ]; then sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"; fi
          # Gradle reads the SDK location from here (local.properties is gitignored).
          echo "sdk.dir=$sdk" > android/local.properties

          # Accept licences + top up the compile SDK. Both ship with the runner
          # image, so this is usually a no-op; it is guarded so it can never be
          # the reason a build fails.
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager || true)"
          if [ -n "$sdkmanager" ]; then
            timeout 180 bash -c "yes | '$sdkmanager' --licenses" > /dev/null 2>&1 || true
            timeout 600 "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

          echo "Android SDK: $sdk"
          echo "platforms:   $(ls "$sdk/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$sdk/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble the debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # CI logs are not always reachable (they live behind a signed blob URL), so
      # a failed build also reports itself in the job summary and as annotations.
      - name: Report the Gradle failure
        if: failure()
        run: |
          log=/tmp/gradle.log
          [ -f "$log" ] || log=/dev/null
          {
            echo '### Gradle output (last 120 lines)'
            echo '```text'
            tail -120 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -12 "$log" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

      - name: Upload the debug APK
        uses: actions/upload-artifact@v5
        with:
          name: BrutalTodo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
