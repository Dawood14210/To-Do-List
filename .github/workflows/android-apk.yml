name: Android APK

# Builds a debug APK on every push to main, and on demand from the Actions tab
# (Run workflow ▸ Android APK ▸ Run workflow) so anyone can grab an installable
# build without setting up Android Studio.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one build per ref: a new push cancels the previous, still-running one.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync the web build into the Android project
        run: npx cap sync android

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages the project compiles against
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble the debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BrutalTodo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
